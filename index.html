    #app-splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#93c5f8 0%,#dac0ee 50%,#fbb7d2 100%);transition:opacity .5s ease}
    #app-splash.splash-hidden{opacity:0;pointer-events:none}
    #app-splash .splash-logo{width:170px;height:170px;object-fit:contain;filter:drop-shadow(0 8px 18px rgba(80,60,120,.18));animation:splash-pop .6s cubic-bezier(.34,1.56,.64,1) both}
    #app-splash .splash-title{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 44px);text-align:center;font-family:'Great Vibes','Dancing Script',cursive;font-size:34px;font-weight:400;letter-spacing:1px;color:rgba(255,255,255,.78);text-shadow:0 1px 8px rgba(80,60,120,.12);opacity:0;animation:splash-fade-up .6s ease .25s both}
    @keyframes splash-pop{0%{opacity:0;transform:scale(.55)}100%{opacity:1;transform:scale(1)}}
    @keyframes splash-fade-up{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
  </style>
